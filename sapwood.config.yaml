# sapwood configuration — hand-edited, inline comments. Validated by a Zod schema
# (engine/src/config.ts) after parse. This file is YAML, but the parser also accepts
# JSON (YAML ⊃ JSON), so a sapwood.config.json works with zero extra code.
#
# Only `board.owner`, `board.repo`, and `board.projectNumber` are required; everything
# else has a default shown below. `sapwood init` writes a starter copy of this file.

board:
  owner: herehigher # GitHub user or org that owns the repo + ProjectV2 board
  repo: sapwood # the repository name (every gh call targets owner/repo)
  # ownerKind: user           # auto-detected at init (user | org) if omitted
  projectNumber: 4 # the ProjectV2 board number
  statusField: Status # the board's single-select field used as the work queue
  status: # lane names on that field (no literals baked into code)
    ready: Ready
    inProgress: In Progress
    done: Done

# engine:
#   tickIntervalSec: 60 # how often the engine calls tick() (also feeds the wall-clock
#                        # cost ceiling's session-gap scaling)
#   driver: rounds       # #106: "rounds" (default) - the round orchestrator (aligning/
#                        # architecting/dispatch/harvesting/retro peripherals wrapped
#                        # around the tick engine, one round at a time). "tick" - the
#                        # bare M4 loop driver (no peripherals; --once/--until-idle
#                        # apply), kept as an explicit escape hatch.

lanes:
  max: 3 # max concurrent workers
  roundDispatchCap: 2 # max new dispatches per round (conservative default)
  reserveCap: 1 # lanes held back as reserve
  prFixCap: 2 # max PR-fix iterations before escalating
  frictionMin: 0 # min minutes between dispatches (rate limit; 0 = off)

worker:
  model: opus
  effort: high # low | medium | high
  timeoutSec: 3600 # wall-clock hard cap (safety bound)
  budgetUsdSoft: 10 # SOFT per-worker budget: auto-enforced via a live TOKEN-ESTIMATE (#33) —
  #                   crossing it triggers a graceful handoff (commit+push WIP, progress note,
  #                   .handoff sentinel, clean exit — never a mid-work kill). The estimate is a
  #                   rate-table approximation (see pricingFile below), not the real billed
  #                   cost; it's reconciled against the real total_cost_usd (logged) once the
  #                   worker finishes.
  # pricingFile: pricing/my-rates.yaml
  #                   Override the model rate table the soft-budget estimator prices against.
  #                   Relative paths resolve against THIS config file's directory (like
  #                   promptFile). Unset = the engine's shipped pricing.yaml (commented copy of
  #                   the current per-model USD/MTok rates — input/output/cacheWrite/cacheRead
  #                   per model alias; your file REPLACES it entirely, no merging). Missing/
  #                   malformed file = startup error, never a silent fallback.
  heartbeatStaleSecs: 180 # heartbeat older than this => worker considered dead
  # promptFile: prompts/my-worker.md
  #                   #74: override the worker prompt with your own template file. Relative
  #                   paths resolve against THIS config file's directory. Supported {{vars}}:
  #                   issue.number, issue.title, issue.body, issue.labels, labels.verifyNa.
  #                   Missing/unreadable/empty file or an unknown {{var}} = startup error,
  #                   never a silent fallback. Unset = the engine's shipped prompts/worker.md
  #                   (TDD + two-gate method).

cost: # engine-enforced HARD ceiling (safety boundary, drains before killing)
  roundBudgetUsd: 30
  dailyBudgetUsd: 100

reviewer:
  # different-model-codex: 0day-style gate② (fresh non-author Codex review) — default.
  # same-model-trusted | human | produce-pr-and-stop are the other modes.
  mode: different-model-codex
  trustedReviewers: [] # allowlisted reviewer logins (public-repo hardening, v1.1)
  # fallback: ordered, opt-in reviewer failover (empty by default = queue forever, unchanged
  # behavior — falling back to a weaker trust mode is NEVER silent). Each entry keeps its own
  # mode semantics (identity allowlist / any-non-author-approval), and the always-blocking
  # signals (unresolved threads, a standing CHANGES_REQUESTED) block regardless of failover.
  # NOTE: same-model-trusted here REQUIRES a non-empty trustedReviewers list above — the
  # combination with an empty list is rejected at parse (it could never produce a verdict).
  # Example:
  # fallback: [same-model-trusted, human]
  fallback: []
  # How long (seconds, since the last review trigger) the primary may stay unavailable before
  # gate② hands off to the first fallback entry that itself reaches a decisive verdict.
  failoverAfterSec: 1200

labels: # taxonomy used by the loop
  inProgress: in-progress
  needsHuman: needs-human
  blocked: blocked
  reserve: reserve
  verifyNa: verify:n/a # Decision #8: issues with this label skip the verification-plan gate
  # planApproved: plan:approved
  #                   #88 gate⓪: applied by the plan-reviewer peripheral itself, never by a
  #                   human or the loop directly — required (alongside a real plan section)
  #                   for a non-verify:n/a issue to become dispatchable.

# #87/#104: peripheral role sessions — the round orchestrator's aligning (PO)/architecting/
# plan_review (gate⓪)/harvesting/retro phases, each a role-scoped session wired into runRounds's
# default peripherals map by round-defaults.ts. Never code, never PR review/approve/merge except
# retro (proposals land exclusively as PRs through gate②, never a direct write). Cheaper defaults
# than worker.model/effort (real implementation work): every role defaults to sonnet/medium,
# fully overridable.
# roles:
#   planReviewer:
#     # promptFile: prompts/my-plan-reviewer.md
#     #                   #74-style override; relative paths resolve against THIS config file's
#     #                   directory. Unset = the engine's shipped prompts/plan-reviewer.md.
#     model: sonnet
#     effort: medium
#     maxDraftCycles: 2  # #77 Amendment 2: bounded draft->re-review self-heal cycles per issue
#                        # before the loop gives up and applies needs-human with the attempt
#                        # trail. Positive int only (0 would disable the self-heal path).
#   planDrafter:
#     # promptFile: prompts/my-plan-drafter.md
#     #                   Unset = the engine's shipped prompts/plan-drafter.md.
#     model: sonnet
#     effort: medium
#   architect: # #90: round design/review between goal alignment and dispatch — issues-only
#     #          writes (comments a round design note; flags contradicting issues).
#     # promptFile: prompts/my-architect.md
#     #                   Unset = the engine's shipped prompts/architect.md.
#     model: sonnet
#     effort: medium
#     planMdPath: docs/PLAN.md # #104: the architecture-doc path the architect (and the PO's
#                        # alignment pass) read for context. Same #74-style resolution as
#                        # promptFile: a relative path resolves against THIS config file's
#                        # directory. Default docs/PLAN.md — override for target repos that
#                        # keep their architecture doc somewhere else (or don't have one).
#   harvest: # #91: round-close summary — comments round context onto this round's
#     #        needs-human issues. Issue-comment writes only (no labels, no body edits).
#     # promptFile: prompts/my-harvest.md
#     #                   Unset = the engine's shipped prompts/harvest.md.
#     model: sonnet
#     effort: medium
#   retro: # #91: retrospective/self-evolution — analyzes the round and proposes
#     #      prompt/config/docs improvements EXCLUSIVELY as PRs through gate②
#     #      (#77 decision 6); it can never write main/docs directly.
#     # promptFile: prompts/my-retro.md
#     #                   Unset = the engine's shipped prompts/retro.md.
#     model: sonnet
#     effort: medium
#     everyNRounds: 1    # #104: retro cadence — 1 (default) runs every round; N>1 thins it to
#                        # every Nth round (by round id). Positive int only.

# round-loop scoping (#86 skeleton). Unset = no scoping (every Ready issue is a candidate).
# round:
#   milestone: M4 # exact GitHub milestone title (same matching as stop.onMilestoneComplete).
#                 # Scopes this round's dispatch batch to that milestone's issues, and ends
#                 # the round's dispatch early once it has zero open issues left.
#   standby: # #125: pre-round probe + exponential backoff — before opening a NEW round,
#            # check (pure GitHub API, no LLM) whether there's provably anything to do: a
#            # Ready issue, a plan-review candidate, or (with round.milestone set above) an
#            # open issue still left in it. All empty => wait instead of spinning up all
#            # five peripheral role sessions for nothing; any hit opens the round immediately.
#     enabled: true
#     backoffCapSec: 1800 # cap on engine.tickIntervalSec * 2^n (n = consecutive empty
#                         # probes); any probe hit resets the exponent. Default 30min.

escalation:
  humanLabels: [needs-human, blocked] # any of these => stop autonomy, ask a human

coverage:
  minPercent: 0 # test-coverage gate (0 = off for M0)

optimize:
  recur: false # enable the recurring optimization round

# Milestones `sapwood init` ensures exist (idempotent). Empty = create none — the loop
# needs labels + board lanes, not milestones (those are your organizational choice).
milestones: []
# milestones: [M0, M1, v1.0]

