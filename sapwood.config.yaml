# sapwood's own live configuration — the file the autonomous loop on THIS repository runs from
# (`sapwood run` from the repo root, no `--config`). Committed so that every governing value
# has a PR-shaped audit trail; the whole file is human-merge-only (guard rule + docs/security.md
# "Human-merge-only paths"). Not a starter for another repository — that is
# sapwood.config.example.yaml (docs/guide/configuration.md "Two config files").
#
# Written here: (a) every non-default value, and (b) every value that changes authority,
# merge/review behaviour, a security boundary, or a governance name — pinned even when it equals
# today's schema default, so a default change in engine/src/config/config.ts can never silently
# change what governs this repo. Purely operational defaults are omitted. Change = PR + restart.

goal:
  file: docs/PLAN.md # sapwood's goal file (framework default: docs/GOAL.md)

board:
  owner: herehigher
  repo: sapwood
  projectNumber: 6 # the dogfood board the loop drives; Project #4 is the human board, no engine runs on it
  statusField: Status
  status:
    backlog: Todo
    ready: Ready
    inProgress: In Progress
    done: Done

lanes:
  roundDispatchCap: 6 # two concurrency-wide waves per round, amortising the align/architect/harvest/retro cost
  prFixCap: 4 # explicit on purpose: the fix-leg cap this repo runs with (= schema default, #450)

worker:
  model: sonnet
  budgetUsdSoft: 30
  maxResumes: 4

cost:
  roundBudgetUsd: 180
  dailyBudgetUsd: 300

reviewer:
  mode: engine-agent
  agent:
    model: gpt-5.6-sol
    runner: codex-exec
    effort: high

ci:
  requiredChecks:
    - name: test # .github/workflows/ci.yml job; #784 refuses to start engine-agent review without one

# ── governance pins (equal to today's defaults; see header) ──────────────────────────────────
guard:
  mode: hard
merge:
  mode: conductor-merge
proxy:
  enabled: true
labels:
  prefix: "sapwood:"
  humanMergeOnly: "sapwood:human-merge-only"
escalation:
  humanLabels: ["sapwood:needs-human", "sapwood:blocked"]
  holdLabels: ["sapwood:hold"]
  instructionPaths:
    - CLAUDE.md
    - CLAUDE.local.md
    - .claude/CLAUDE.md
    - .claude/rules/**
    - AGENTS.md
    - engine/prompts/**
    - engine/src/forge/forge.ts
    - engine/src/proxy/**
    - engine/src/review/instruction-path-escalation.ts
    - engine/src/config/config.ts
    - sapwood.config.example.yaml
    - docs/security.md
    - docs/security/**
    - engine/src/roles/skills-plugin.ts
    - engine/src/forge/labels.ts
    - .github/CODEOWNERS
doctrine:
  file: docs/REVIEW-DOCTRINE.md

round:
  milestone: "v0.2 — Dashboard (dogfood)"

roles:
  po:
    model: fable
    effort: high
  architect:
    model: fable
    effort: high
  verificationPlanReviewer:
    model: sonnet
    effort: high
  harvest:
    model: sonnet
    effort: high
  retro:
    model: sonnet
    effort: high
