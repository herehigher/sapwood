name: CI (self-hosted)

# Manual dispatch ONLY — no `pull_request`/`push` trigger. This repo is going public
# soon, and a self-hosted runner must never execute code from a fork PR (arbitrary
# untrusted code running on the owner's own Mac). The hosted `ci.yml` (ubuntu-latest,
# pull_request + push) remains the required PR gate; this workflow is an opt-in,
# manually-triggered preview run against the self-hosted mac-mini-docker-runner (or
# ubuntu-latest, for comparison), never a merge record.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to execute this job on
        type: choice
        default: mac-mini-docker-runner
        options:
          - mac-mini-docker-runner
          - ubuntu-latest

# Distinct group from ci.yml's `ci-*` group: dispatch runs are previews, not the merge
# record, so always cancel a superseded one — no main-branch carve-out needed here.
concurrency:
  group: ci-selfhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Resolves to the self-hosted label array for the mac-mini-docker-runner choice,
    # or the plain ubuntu-latest string otherwise (fromJSON ternary — GitHub Actions
    # `runs-on` accepts either a string or an array, so the two arms of the ternary
    # must each individually be valid `runs-on` values).
    runs-on: ${{ inputs.runner == 'mac-mini-docker-runner' && fromJSON('["self-hosted", "mac-mini-docker-runner"]') || 'ubuntu-latest' }}
    # #691: GitHub's default job ceiling is 360 minutes. The whole suite runs in ~3.5
    # minutes, so that default is not a ceiling — it is six hours of billable runner time
    # for one wedged test (which is exactly what it cost). 20 minutes is ~5x the real
    # worst case and still bounds a hang to a rounding error.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace engine run typecheck
      - run: npm --workspace dashboard run typecheck
      - run: npm run lint
      # #691: the per-step wall clock is NOT redundant with timeout-minutes. `timeout`
      # kills the command and the step fails RED with its output intact, so the log names
      # what wedged; a job-level timeout cancels the run and reports nothing useful.
      # node:test's own `--test-timeout` (#667) cannot do this — measured 2026-08-05, it
      # prints the verdict on time and the runner keeps running. `timeout` is GNU
      # coreutils; the mac-mini-docker-runner choice is assumed to execute jobs inside a
      # Linux (Docker) environment that provides it, matching ubuntu-latest.
      #
      # `--kill-after=30s` escalates to SIGKILL when the group survives the initial
      # SIGTERM. Not hypothetical here: this suite DELIBERATELY spawns SIGTERM-immune
      # children (worker.test.ts's `leaderExitStub({ ignoreTerm: true })`, the shape #668
      # round 8 stopped force-killing in production on purpose), which is exactly the case
      # a TERM-only timeout cannot end. No `--foreground`: without it `timeout` signals the
      # whole process group, so the `npm` wrapper cannot shield the `node --test`
      # grandchild — `--foreground` would WEAKEN that (Codex gate② review of PR #692).
      # Residual, stated honestly: a descendant that detaches into its OWN process group
      # (setsid) escapes either form — that is the test-side half of #691, not this file's.
      #
      # Steps below mirror ci.yml's step list exactly; ci.yml is the canonical source —
      # if it changes, update this file too (drift check is manual, no automated diff).
      - run: timeout --kill-after=30s 600 npm --workspace engine test
      - run: timeout --kill-after=30s 300 npm --workspace dashboard test
