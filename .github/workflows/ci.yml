name: CI
# No secrets. `test` runs on a GitHub-hosted runner only: a fork PR's code must never
# execute on infrastructure we own.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs (#691) — except on main, whose runs are the merge record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Whole suite ~3.5 min; 20 bounds a wedged run instead of the 360-min default (#691).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace engine run typecheck
      - run: npm --workspace dashboard run typecheck
      - run: npm run lint
      - run: npm run check-links
      # Per-step `timeout` (GNU coreutils, from the runner's Linux Docker environment)
      # is not redundant with timeout-minutes: it fails the step RED with output naming
      # what wedged, where the job-level timeout cancels silently. `--kill-after`
      # escalates to SIGKILL — the suite deliberately spawns SIGTERM-immune children.
      # No `--foreground`: the whole process group must be signalled so the npm wrapper
      # can't shield the `node --test` grandchild. (#691; PR #692 review.)
      - run: timeout --kill-after=30s 600 npm --workspace engine test
      - run: timeout --kill-after=30s 300 npm --workspace dashboard test
      # Root scripts/*.test.ts (release-manifest lockstep, publish argv, packed-tarball
      # install/run). Builds the engine itself, hence its own step (#1030/#1032).
      - run: claude --version || true
      - run: timeout --kill-after=30s 300 node --test scripts/*.test.ts
