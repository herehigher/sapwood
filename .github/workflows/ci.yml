name: CI
# This workflow intentionally uses no secrets. Pre-public, `test` uses a self-hosted
# runner and fork-PR execution is prohibited (see its boundary below). The unconditional
# fork-PR-safety claim applies only after #329 restores the hosted-runner configuration.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# #691: a superseded run is pure cost. On 2026-08-05 a wedged `engine test` ran 6h on
# worktree-lane-668-634a903e while THREE newer commits landed on the same branch, each
# starting its own run; cancel-in-progress alone would have capped that incident at ~40
# minutes. `main` is excluded from cancellation (its runs are the merge record, not a
# preview) — see the group expression.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # PRE-PUBLIC ONLY: this job runs on the owner's self-hosted runner while the repo
    # is private (all PR authors are trusted collaborators). BEFORE the repo goes
    # public this MUST be flipped back to `ubuntu-latest` — a fork PR must never
    # execute on the self-hosted runner. Full removal list (this flip, the actionlint
    # label entry, and deregistering the runner) tracked on the go-public cutover
    # checklist (#329).
    runs-on: [self-hosted, mac-mini-docker-runner]
    # #691: GitHub's default job ceiling is 360 minutes. The whole suite runs in ~3.5
    # minutes, so that default is not a ceiling — it is six hours of billable runner time
    # for one wedged test (which is exactly what it cost). 20 minutes is ~5x the real
    # worst case and still bounds a hang to a rounding error.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace engine run typecheck
      - run: npm --workspace dashboard run typecheck
      - run: npm run lint
      # #691: the per-step wall clock is NOT redundant with timeout-minutes. `timeout`
      # kills the command and the step fails RED with its output intact, so the log names
      # what wedged; a job-level timeout cancels the run and reports nothing useful.
      # node:test's own `--test-timeout` (#667) cannot do this — measured 2026-08-05, it
      # prints the verdict on time and the runner keeps running. `timeout` is GNU
      # coreutils. While this job runs on the self-hosted mac-mini-docker-runner
      # (pre-public), `timeout` is provided by that runner's Linux Docker execution
      # environment.
      #
      # `--kill-after=30s` escalates to SIGKILL when the group survives the initial
      # SIGTERM. Not hypothetical here: this suite DELIBERATELY spawns SIGTERM-immune
      # children (worker.test.ts's `leaderExitStub({ ignoreTerm: true })`, the shape #668
      # round 8 stopped force-killing in production on purpose), which is exactly the case
      # a TERM-only timeout cannot end. No `--foreground`: without it `timeout` signals the
      # whole process group, so the `npm` wrapper cannot shield the `node --test`
      # grandchild — `--foreground` would WEAKEN that (Codex gate② review of PR #692).
      # Residual, stated honestly: a descendant that detaches into its OWN process group
      # (setsid) escapes either form — that is the test-side half of #691, not this file's.
      - run: timeout --kill-after=30s 600 npm --workspace engine test
      - run: timeout --kill-after=30s 300 npm --workspace dashboard test
      # #1030/#1032: the root `scripts/*.test.ts` suite (release-manifest lockstep,
      # publish-step argv, and the packed-tarball install/run check) was never wired into
      # CI — only the two workspace `test` scripts above were. It builds the engine itself
      # (scripts/pack.test.ts), hence its own `run` step rather than folding into the
      # engine job above.
      - run: timeout --kill-after=30s 300 node --test scripts/*.test.ts
