name: Release
# Runs once per pushed release tag (docs/dev-guide/10-releasing.md's `publish` step creates the
# GitHub Release as a draft FIRST, then pushes the tag — in that order, so a failed draft
# creation never leaves a tag pushed with nothing for this job to attach evidence to).
# Rebuilds with a CI build stamp, reruns the full quality gate against the exact tagged commit,
# and attaches the verified `--version` output as release evidence. This job does not create a
# release itself: it expects the draft to already exist, and fails loud if it doesn't, rather
# than racing `publish`'s own creation of it. It attaches evidence to that draft and only then
# publishes it (`--draft=false`): release immutability is ON for this repo, so a published
# release's assets are frozen the instant it stops being a draft — see
# docs/dev-guide/10-releasing.md. No publish secrets — `GITHUB_TOKEN` only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  attach-evidence:
    # Tags are pushed only by someone with push access, so unlike ci.yml's PR-triggered jobs
    # this never runs a stranger's code; a GitHub-hosted runner is the safe default either way.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # npm provenance (docs/dev-guide/10-releasing.md) needs this to mint its attestation via
      # OIDC. No `npm publish` step runs in this workflow yet — publish stays an operator-run
      # `scripts/release.ts` step — this just keeps the permission in place for when it does.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `scripts/release.ts`'s `stamp` subcommand ships in the companion release-policy PR
      # (#1030) — this job depends on it already being on the tagged commit.
      - run: npm run release -- stamp
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Record the built, stamped --version as release evidence
        run: node engine/dist/cli.js --version > release-evidence.txt
      - name: Attach evidence to the draft, then publish
        run: |
          # No fallback creation here on purpose: `scripts/release.ts publish` creates the draft
          # before it ever pushes the tag that triggers this job, so a missing release means
          # that step didn't run (or failed) — not a gap for this job to paper over.
          if ! is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            echo "::error::no release found for $GITHUB_REF_NAME — \`npm run release -- publish\` creates the draft before pushing the tag; run that first." >&2
            exit 1
          fi
          if [[ "$is_draft" != "true" ]]; then
            # Immutability means a published release's assets can never be added, changed, or
            # removed (docs/dev-guide/10-releasing.md) — uploading here would silently no-op or
            # error deep in `gh`. Neutral wording, not an accusation: this message must stay
            # retry-safe, since a re-run of this job hitting it again is an expected outcome,
            # not evidence of anything having gone wrong.
            echo "::error::release $GITHUB_REF_NAME is already published; under release immutability its assets are frozen — inspect them; this job attaches evidence only to a draft." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" release-evidence.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
