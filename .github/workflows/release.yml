name: Release
# Runs once per pushed release tag (docs/dev-guide/10-releasing.md's `publish` step creates the
# GitHub Release as a draft FIRST, then pushes the tag — in that order, so a failed draft
# creation never leaves a tag pushed with nothing for this job to attach evidence to).
# Rebuilds with a CI build stamp, reruns the full quality gate against the exact tagged commit,
# and attaches the verified `--version` output, the packed engine tarball, and its Sigstore
# provenance bundle as release evidence. This job does not create a release itself: it expects
# the draft to already exist, and fails loud if it doesn't, rather than racing `publish`'s own
# creation of it. It attaches evidence to that draft and only then publishes it
# (`--draft=false`): release immutability is ON for this repo, so a published release's assets
# are frozen the instant it stops being a draft — see docs/dev-guide/10-releasing.md. No publish
# secrets of any kind: `attach-evidence` uses `GITHUB_TOKEN` plus OIDC-minted Sigstore signing
# for the tarball attestation, and `npm-publish` authenticates to npm via trusted publishing
# (OIDC) too — both `id-token: write` permissions mint short-lived tokens from GitHub itself,
# nothing stored in this repo. A third job redeploys the public demo dashboard to GitHub Pages
# (`deploy-demo`).
on:
  push:
    tags: ["v*"]
  # Manual trigger runs only `deploy-demo` (it is gated below): re-publishes the Pages showcase
  # from whatever ref was dispatched without touching any release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach-evidence:
    if: github.event_name == 'push'
    # Tags are pushed only by someone with push access, so unlike ci.yml's PR-triggered jobs
    # this never runs a stranger's code; a GitHub-hosted runner is the safe default either way.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # OIDC-minted Sigstore signing for the tarball attestation below, no stored secret —
      # same model as `npm-publish`'s trusted publishing.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `scripts/release.ts`'s `stamp` subcommand ships in the companion release-policy PR
      # (#1030) — this job depends on it already being on the tagged commit.
      - run: npm run release -- stamp
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Record the built, stamped --version as release evidence
        run: node engine/dist/cli.js --version > release-evidence.txt
      - name: Pack the engine tarball
        id: pack
        # Engine `prepack` (engine/package.json) reruns the rebuild/stamp and copies README/LICENSE
        # into engine/ (gitignored) — expected, not a stray diff. npm prints the tarball filename
        # as its last stdout line, so no second invocation is needed to learn the name.
        run: |
          tarball="$(npm pack --workspace engine --pack-destination . | tail -n1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Attest tarball provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Attach evidence to the draft, then publish
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # No fallback creation here on purpose: `scripts/release.ts publish` creates the draft
          # before it ever pushes the tag that triggers this job, so a missing release means
          # that step didn't run (or failed) — not a gap for this job to paper over.
          if ! is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            echo "::error::no release found for $GITHUB_REF_NAME — \`npm run release -- publish\` creates the draft before pushing the tag; run that first." >&2
            exit 1
          fi
          if [[ "$is_draft" != "true" ]]; then
            # Immutability means a published release's assets can never be added, changed, or
            # removed (docs/dev-guide/10-releasing.md) — uploading here would silently no-op or
            # error deep in `gh`. Neutral wording, not an accusation: this message must stay
            # retry-safe, since a re-run of this job hitting it again is an expected outcome,
            # not evidence of anything having gone wrong.
            echo "::error::release $GITHUB_REF_NAME is already published; under release immutability its assets are frozen — inspect them; this job attaches evidence only to a draft." >&2
            exit 1
          fi
          # The action emits one Sigstore bundle (JSON) for this one subject; `.sigstore.json`
          # names what the file is, and is a suffix Scorecard's `releasesAreSigned` probe reads.
          cp "$BUNDLE_PATH" "$TARBALL.sigstore.json"
          gh release upload "$GITHUB_REF_NAME" release-evidence.txt "$TARBALL" "$TARBALL.sigstore.json" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # Publishes the engine workspace to npm as `sapwood`, authenticated via npm trusted publishing
  # (OIDC): npm's registry trusts this exact workflow file in this exact repo, this job requests
  # a short-lived GitHub-issued OIDC token via `id-token: write`, and npm CLI >= 11.5.1 (bundled
  # with Node 24) detects and uses it automatically — no NPM_TOKEN, no human 2FA prompt, and
  # provenance attestation is generated by default for a public repo + public package (npm's own
  # docs: "you don't need to add the --provenance flag"). Must run on a GitHub-hosted runner —
  # self-hosted runners cannot mint this token. `scripts/release.ts publish` waits for this job's
  # run (`gh run watch`, then this job's own conclusion) before treating the release as delivered — see
  # docs/dev-guide/10-releasing.md.
  npm-publish:
    needs: attach-evidence
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `engine`'s own `prepack` (engine/package.json) rebuilds the CLI, stamps it, and stages
      # the dashboard build via engine/scripts/stage-dashboard.ts — all driven from this root
      # `npm ci`, the same way a local `npm publish --workspace engine` already works today.
      - run: npm publish --workspace engine --tag "$(node scripts/release.ts dist-tag "${GITHUB_REF_NAME#v}")"

  # The public read-only replay showcase. `VITE_DEMO_ONLY=1` makes the bundle's root URL land in
  # `?demo` mode (dashboard/src/App.tsx `isDemoRoute`). The dashboard build already runs the
  # fixture export gate (credential scan + host-absolute-path rewrite) before Vite copies the
  # fixture in, so this job adds no scrubbing of its own. Pages source must be "GitHub Actions"
  # (repo Settings → Pages); `GITHUB_TOKEN` cannot enable that itself. The `github-pages`
  # environment's deployment branch policy must also allow `v*` tags (Settings → Environments →
  # github-pages → Deployment branches and tags, or `POST
  # /repos/{owner}/{repo}/environments/github-pages/deployment-branch-policies
  # {"name":"v*","type":"tag"}`) — a tag-push run deploys from `refs/tags/v<version>`, which a
  # `main`-only policy rejects before any step here runs, producing no job log to explain why.
  deploy-demo:
    needs: attach-evidence
    # `always()` so a manual dispatch (where attach-evidence is skipped, not failed) still deploys;
    # on a tag push the showcase only follows a release that actually published.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.attach-evidence.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace dashboard run build
        env:
          VITE_DEMO_ONLY: "1"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard/dist
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
