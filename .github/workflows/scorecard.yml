name: Scorecard analysis
# External, third-party-readable attestation of this repo's supply-chain posture
# (OpenSSF Scorecard). `publish_results: true` needs the OIDC token below to prove
# the result came from this repo's own workflow run, not a forged submission.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, off-peak UTC — arbitrary fixed slot, not tied to any other cadence.
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Job-level permissions replace the top-level block, so checkout's read must be restated.
      contents: read
      # SARIF upload to the code-scanning dashboard.
      security-events: write
      # Consumed by `publish_results: true` for the GitHub OIDC token that
      # authenticates the published result as coming from this workflow.
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Optional per the upstream template: keeps SARIF results browsable from the
      # Actions tab for a short window without depending on the codeql-action upload.
      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
