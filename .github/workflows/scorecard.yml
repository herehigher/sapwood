name: Scorecard analysis
# External, third-party-readable attestation of this repo's supply-chain posture
# (OpenSSF Scorecard). `publish_results: true` needs the OIDC token below to prove
# the result came from this repo's own workflow run, not a forged submission.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, off-peak UTC — arbitrary fixed slot, not tied to any other cadence.
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # SARIF upload to the code-scanning dashboard.
      security-events: write
      # Consumed by `publish_results: true` for the GitHub OIDC token that
      # authenticates the published result as coming from this workflow.
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Optional per the upstream template: keeps SARIF results browsable from the
      # Actions tab for a short window without depending on the codeql-action upload.
      - name: "Upload artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: results.sarif
