name: Catalog CI

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Reject files outside the catalog shell
        run: |
          invalid=$(git ls-files | awk '$0 !~ /^(\.claude-plugin\/|commands\/|bin\/|marketplace\.json$|\.github\/workflows\/|README\.md$)/')
          test -z "$invalid" || { printf '%s\n' "$invalid"; exit 1; }
      - name: Validate marketplace and plugin versions
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const marketplace = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
          const plugin = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
          const entry = marketplace.plugins?.[0];
          if (!entry || entry.source !== "./") throw new Error("marketplace plugins[0] must use source './'");
          if (entry.version !== plugin.version) throw new Error("marketplace and plugin versions disagree");
          NODE
      - name: Validate plugin manifest strictly
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.237
          claude plugin validate .claude-plugin/plugin.json --strict
