<svg viewBox="0 0 1056 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-loop-title hero-loop-desc">
  <title id="hero-loop-title">sapwood hero loop</title>
  <desc id="hero-loop-desc">A human signs an issue Ready; a worker pushes while the guard denies approve and merge; the engine opens or adopts the PR and gates it on CI and independent review; findings loop back under a fix cap, non-convergence stops for a human.</desc>
  <defs>
    <marker id="hl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="hl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4C6EF5"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAFAFA"/>
  <!-- role bands -->
  <rect x="40" y="32" width="976" height="96" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
  <rect x="48" y="36" width="48" height="12" rx="2" fill="#FAFAFA"/>
  <text x="72" y="45" fill="rgba(45,49,66,0.55)" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">HUMAN</text>
  <rect x="40" y="144" width="976" height="96" rx="8" fill="rgba(18,184,134,0.07)" stroke="rgba(18,184,134,0.50)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <rect x="48" y="148" width="96" height="12" rx="2" fill="#FAFAFA"/>
  <text x="96" y="157" fill="#0E9F75" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">WORKER SESSION</text>
  <rect x="40" y="256" width="976" height="96" rx="8" fill="rgba(76,110,245,0.06)" stroke="rgba(76,110,245,0.35)" stroke-width="0.8"/>
  <rect x="48" y="260" width="48" height="12" rx="2" fill="#FAFAFA"/>
  <text x="72" y="269" fill="#4C6EF5" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">ENGINE</text>

  <!-- edges -->
  <path d="M176,80 H256 Q264,80 264,88 V176" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>
  <path d="M344,200 H444 Q452,200 452,208 V288" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>
  <line x1="520" y1="312" x2="560" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>
  <line x1="696" y1="312" x2="736" y2="312" stroke="#4C6EF5" stroke-width="1.2" marker-end="url(#hl-arrow-accent)"/>
  <path d="M620,288 V144 Q620,136 612,136 H304 Q296,136 296,144 V176" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#hl-arrow)"/>
  <line x1="660" y1="288" x2="660" y2="104" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#hl-arrow)"/>
  <line x1="880" y1="312" x2="920" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>

  <!-- edge labels -->
  <rect x="272" y="100" width="96" height="12" rx="2" fill="#FAFAFA"/>
  <text x="320" y="109" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">SIGNED WHY/WHAT</text>
  <rect x="460" y="228" width="168" height="24" rx="2" fill="#FAFAFA"/>
  <text x="544" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">PUSH —</text>
  <text x="544" y="248" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">GUARD DENIES APPROVE / MERGE</text>
  <rect x="700" y="292" width="32" height="12" rx="2" fill="#FAFAFA"/>
  <text x="716" y="301" fill="#4C6EF5" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">PASS</text>
  <rect x="400" y="116" width="120" height="12" rx="2" fill="#FAFAFA"/>
  <text x="460" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">FINDINGS, UNDER FIX CAP</text>
  <rect x="672" y="190" width="80" height="12" rx="2" fill="#FAFAFA"/>
  <text x="712" y="199" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">NON-CONVERGENT</text>

  <!-- nodes -->
  <rect x="64" y="56" width="112" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="64" y="56" width="112" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="120" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Ready issue</text>
  <rect x="560" y="56" width="136" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="560" y="56" width="136" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="628" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">needs-human</text>
  <rect x="216" y="176" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Worktree worker</text>
  <rect x="384" y="288" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="452" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Engine opens</text>
  <text x="452" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">(or adopts) the PR</text>
  <rect x="560" y="288" width="136" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="560" y="288" width="136" height="48" rx="6" fill="rgba(76,110,245,0.08)" stroke="#4C6EF5" stroke-width="1.2"/>
  <text x="628" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">CI + independent</text>
  <text x="628" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">review</text>
  <rect x="736" y="288" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="808" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Merge</text>
  <text x="808" y="324" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">(never the producer)</text>
  <rect x="920" y="288" width="80" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="960" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Done</text>
</svg>
