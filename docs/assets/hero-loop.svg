<svg viewBox="0 0 1024 144" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-loop-title hero-loop-desc">
  <title id="hero-loop-title">sapwood hero loop</title>
  <desc id="hero-loop-desc">A worker claims a Ready issue and pushes; the engine opens the PR, gates it on CI and an independent review, then merges it or stops for a human.</desc>
  <defs>
    <marker id="hl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="hl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4C6EF5"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAFAFA"/>

  <!-- arrows first (all on y=68, shared axis → straight lines) -->
  <line x1="136" y1="68" x2="160" y2="68" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>
  <line x1="288" y1="68" x2="312" y2="68" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>
  <line x1="392" y1="68" x2="416" y2="68" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>
  <line x1="544" y1="68" x2="568" y2="68" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>
  <line x1="712" y1="68" x2="736" y2="68" stroke="#4C6EF5" stroke-width="1.2" marker-end="url(#hl-arrow-accent)"/>
  <line x1="880" y1="68" x2="904" y2="68" stroke="#4f5d75" stroke-width="1" marker-end="url(#hl-arrow)"/>

  <!-- A · Ready issue (input) -->
  <rect x="40" y="40" width="96" height="56" rx="6" fill="#FAFAFA"/>
  <rect x="40" y="40" width="96" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="88" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Ready issue</text>

  <!-- B · Worktree worker (step) -->
  <rect x="160" y="40" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="224" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Worktree worker</text>

  <!-- C · push (step) -->
  <rect x="312" y="40" width="80" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="352" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">push</text>

  <!-- D · Engine opens PR (step) -->
  <rect x="416" y="40" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Engine opens PR</text>

  <!-- E · CI + independent review (step, two lines) -->
  <rect x="568" y="40" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="640" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">CI + independent</text>
  <text x="640" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">review</text>

  <!-- F · Merge (or stop for human) — focal -->
  <rect x="736" y="40" width="144" height="56" rx="6" fill="#FAFAFA"/>
  <rect x="736" y="40" width="144" height="56" rx="6" fill="rgba(76,110,245,0.08)" stroke="#4C6EF5" stroke-width="1.2"/>
  <text x="808" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Merge</text>
  <text x="808" y="80" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">(or stop for human)</text>

  <!-- G · Done (terminal oval) -->
  <rect x="904" y="40" width="80" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="944" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Done</text>
</svg>
