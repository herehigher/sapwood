<svg viewBox="0 0 800 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="round-loop-title round-loop-desc">
  <title id="round-loop-title">sapwood round loop</title>
  <desc id="round-loop-desc">A round cycles through align, plan, execute under a round budget and lane caps, harvest, and a retrospective that proposes changes as PRs a human merges; every phase reads and writes the GitHub board, which is the trail.</desc>
  <defs>
    <marker id="rl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="rl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4C6EF5"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAFAFA"/>
  <!-- cycle edges -->
  <path d="M504,64 H656 Q664,64 664,72 V136" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#rl-arrow)"/>
  <line x1="664" y1="184" x2="664" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#rl-arrow)"/>
  <path d="M664,328 V392 Q664,400 656,400 H504" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#rl-arrow)"/>
  <path d="M296,400 H144 Q136,400 136,392 V264" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#rl-arrow)"/>
  <path d="M136,200 V72 Q136,64 144,64 H296" fill="none" stroke="#4C6EF5" stroke-width="1.2" marker-end="url(#rl-arrow-accent)"/>
  <!-- hub edges -->
  <line x1="400" y1="88" x2="400" y2="208" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rl-arrow)"/>
  <path d="M560,304 H464 Q456,304 456,296 V256" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rl-arrow)"/>
  <line x1="240" y1="232" x2="320" y2="232" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rl-arrow)"/>
  <!-- edge labels -->
  <rect x="536" y="226" width="120" height="12" rx="2" fill="#FAFAFA"/>
  <text x="596" y="235" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">ROUND BUDGET · LANE CAPS</text>
  <rect x="144" y="124" width="152" height="24" rx="2" fill="#FAFAFA"/>
  <text x="220" y="133" fill="#4C6EF5" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">NEXT ROUND —</text>
  <text x="220" y="144" fill="#4C6EF5" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">UNTIL A FINAL STOP CONDITION</text>
  <!-- hub -->
  <rect x="320" y="208" width="160" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="320" y="208" width="160" height="48" rx="6" fill="rgba(217,164,65,0.12)" stroke="rgba(217,164,65,0.70)" stroke-width="1"/>
  <text x="400" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">GitHub board · issues · PRs</text>
  <text x="400" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle">— the trail</text>
  <!-- phase nodes -->
  <rect x="296" y="40" width="208" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="400" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Align</text>
  <text x="400" y="76" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">select a bounded pool from Ready</text>
  <rect x="560" y="136" width="208" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="664" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Plan</text>
  <text x="664" y="172" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">architect + plan review</text>
  <rect x="560" y="280" width="208" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="560" y="280" width="208" height="48" rx="6" fill="rgba(76,110,245,0.08)" stroke="#4C6EF5" stroke-width="1.2"/>
  <text x="664" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Execute</text>
  <text x="664" y="316" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">N lanes, gated merge</text>
  <rect x="296" y="376" width="208" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="400" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Harvest</text>
  <rect x="32" y="200" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="136" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Retro</text>
  <text x="136" y="236" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">proposes changes as PRs —</text>
  <text x="136" y="252" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">a human merges</text>
</svg>
