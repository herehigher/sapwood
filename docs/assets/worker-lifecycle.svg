<svg viewBox="0 0 776 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="worker-lifecycle-title worker-lifecycle-desc">
  <title id="worker-lifecycle-title">sapwood worker lane lifecycle</title>
  <desc id="worker-lifecycle-desc">State machine of a worker lane: running leads to driving and fixing; done is terminal; failed can resume into driving for eligible lanes; a soft-budget handoff returns to the state it started from.</desc>
  <defs>
    <marker id="wl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="wl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4C6EF5"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAFAFA"/>

  <!-- transitions -->
  <line x1="62" y1="200" x2="96" y2="200" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <line x1="208" y1="192" x2="272" y2="192" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <line x1="384" y1="192" x2="448" y2="192" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <line x1="448" y1="208" x2="384" y2="208" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <!-- running -> handoff / handoff -> running (resume by origin) -->
  <path d="M152,176 V96 Q152,88 160,88 H272" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <path d="M300,112 V128 Q300,136 292,136 H188 Q180,136 180,144 V176" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#wl-arrow)"/>
  <!-- fixing -> handoff / handoff -> fixing (resume by origin) -->
  <path d="M524,176 V96 Q524,88 516,88 H384" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <path d="M356,112 V128 Q356,136 364,136 H476 Q484,136 484,144 V176" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#wl-arrow)"/>
  <!-- running -> done (over the top) / driving -> done (under the row, hops fixing->failed) -->
  <path d="M124,176 V48 Q124,40 132,40 H672 Q680,40 680,48 V176" fill="none" stroke="#4C6EF5" stroke-width="1.2" marker-end="url(#wl-arrow-accent)"/>
  <path d="M356,224 V248 Q356,256 364,256 H496 a8,8 0 0,1 16,0 H672 Q680,256 680,248 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <!-- -> failed -->
  <path d="M112,224 V312 Q112,320 120,320 H272" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <line x1="300" y1="224" x2="300" y2="288" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <path d="M504,224 V304 Q504,312 496,312 H384" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wl-arrow)"/>
  <!-- failed -> driving (eligible lanes only) -->
  <path d="M272,304 H248 Q240,304 240,296 V216 Q240,208 248,208 H272" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#wl-arrow)"/>

  <!-- transition labels (masked, 6-10px off the stroke) -->
  <rect x="192" y="116" width="96" height="12" rx="2" fill="#FAFAFA"/>
  <text x="240" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">RESUME BY ORIGIN</text>
  <rect x="368" y="116" width="96" height="12" rx="2" fill="#FAFAFA"/>
  <text x="416" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">RESUME BY ORIGIN</text>
  <rect x="124" y="248" width="108" height="12" rx="2" fill="#FAFAFA"/>
  <text x="178" y="257" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">ELIGIBLE LANES ONLY</text>

  <!-- start -->
  <circle cx="56" cy="200" r="6" fill="#2d3142"/>
  <!-- states -->
  <rect x="96" y="176" width="112" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="152" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">running</text>
  <rect x="272" y="176" width="112" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="328" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">driving</text>
  <rect x="448" y="176" width="112" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="504" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">fixing</text>
  <rect x="272" y="64" width="112" height="48" rx="8" fill="#FAFAFA"/>
  <rect x="272" y="64" width="112" height="48" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="328" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">handoff</text>
  <rect x="272" y="288" width="112" height="48" rx="8" fill="#FAFAFA"/>
  <rect x="272" y="288" width="112" height="48" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="328" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">failed</text>
  <!-- done: terminal, double border, focal -->
  <rect x="624" y="176" width="112" height="48" rx="8" fill="#FAFAFA"/>
  <rect x="624" y="176" width="112" height="48" rx="8" fill="rgba(76,110,245,0.08)" stroke="#4C6EF5" stroke-width="1.2"/>
  <rect x="628" y="180" width="104" height="40" rx="6" fill="none" stroke="#4C6EF5" stroke-width="0.8"/>
  <text x="680" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">done</text>
</svg>
