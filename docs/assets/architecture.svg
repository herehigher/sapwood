<svg viewBox="0 0 824 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">sapwood architecture layers</title>
  <desc id="architecture-desc">GitHub holds process truth; the engine's conductor orchestrates through a forge adapter, SQLite state and a merge gate; headless sessions do the work; a pluggable reviewer adapter reviews it.</desc>
  <defs>
    <marker id="ar-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="ar-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
    <marker id="ar-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4C6EF5"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAFAFA"/>

  <!-- zones -->
  <rect x="192" y="32" width="384" height="96" rx="8" fill="rgba(217,164,65,0.10)" stroke="rgba(217,164,65,0.55)" stroke-width="0.8"/>
  <rect x="200" y="36" width="48" height="12" rx="2" fill="#FAFAFA"/>
  <text x="224" y="45" fill="#B8860B" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">GITHUB</text>
  <rect x="592" y="144" width="192" height="96" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.40)" stroke-width="0.8"/>
  <rect x="600" y="148" width="104" height="12" rx="2" fill="#FAFAFA"/>
  <text x="652" y="157" fill="#7C3AED" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">REVIEWER ADAPTER</text>
  <rect x="64" y="144" width="512" height="208" rx="8" fill="rgba(76,110,245,0.06)" stroke="rgba(76,110,245,0.35)" stroke-width="0.8"/>
  <rect x="72" y="148" width="48" height="12" rx="2" fill="#FAFAFA"/>
  <text x="96" y="157" fill="#4C6EF5" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">ENGINE</text>
  <rect x="240" y="368" width="544" height="96" rx="8" fill="rgba(18,184,134,0.07)" stroke="rgba(18,184,134,0.50)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <rect x="248" y="372" width="112" height="12" rx="2" fill="#FAFAFA"/>
  <text x="304" y="381" fill="#0E9F75" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">HEADLESS SESSIONS</text>

  <!-- arrows -->
  <line x1="280" y1="112" x2="280" y2="176" stroke="#4f5d75" stroke-width="1" marker-start="url(#ar-arrow-start)" marker-end="url(#ar-arrow)"/>
  <line x1="280" y1="224" x2="280" y2="288" stroke="#4f5d75" stroke-width="1" marker-start="url(#ar-arrow-start)" marker-end="url(#ar-arrow)"/>
  <line x1="208" y1="312" x2="256" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="384" y1="312" x2="432" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="320" y1="336" x2="320" y2="400" stroke="#4C6EF5" stroke-width="1.2" marker-end="url(#ar-arrow-accent)"/>
  <path d="M352,288 V208 Q352,200 360,200 H432" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="560" y1="200" x2="608" y2="200" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="688" y1="224" x2="688" y2="400" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <path d="M248,424 H56 Q48,424 48,416 V208 Q48,200 56,200 H224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>

  <!-- GitHub (external) -->
  <rect x="208" y="64" width="144" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="208" y="64" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="280" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Board/issues/PRs/CI</text>
  
  <!-- Forge adapter -->
  <rect x="224" y="176" width="112" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Forge adapter</text>
  <!-- Merge gate -->
  <rect x="432" y="176" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="496" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Merge gate</text>
  <!-- Round driver -->
  <rect x="80" y="288" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="144" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Round driver</text>
  <!-- Conductor (focal) -->
  <rect x="256" y="288" width="128" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="256" y="288" width="128" height="48" rx="6" fill="rgba(76,110,245,0.08)" stroke="#4C6EF5" stroke-width="1.2"/>
  <text x="320" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Conductor</text>
  <!-- SQLite state (store) -->
  <rect x="432" y="288" width="128" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="432" y="288" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="496" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">SQLite state</text>

  <!-- Reviewer adapter (pluggable) -->
  <rect x="608" y="176" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="688" y="198" fill="#2d3142" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle">engine-agent / hosted bot</text>
  <text x="688" y="210" fill="#2d3142" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle">same-model-trusted / human</text>
  
  <!-- Workers + guard hook -->
  <rect x="248" y="400" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="320" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Workers + guard hook</text>
  <!-- engine-agent reviewer -->
  <rect x="608" y="400" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="688" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">engine-agent reviewer</text>
</svg>
