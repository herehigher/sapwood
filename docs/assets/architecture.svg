<svg viewBox="0 0 856 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">sapwood architecture layers</title>
  <desc id="architecture-desc">GitHub holds process truth; the engine's conductor orchestrates through a forge adapter, SQLite state and a merge gate; a guarded worker can push but the guard denies approve and merge; the reviewer adapter's verdict gates the merge; human controls are read every tick.</desc>
  <defs>
    <marker id="ar-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="ar-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
    <marker id="ar-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4C6EF5"/></marker>
    <marker id="ar-x" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L7,7 M7,1 L1,7" stroke="#2d3142" stroke-width="1.2"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAFAFA"/>
  <!-- bands -->
  <rect x="192" y="32" width="384" height="96" rx="8" fill="rgba(217,164,65,0.10)" stroke="rgba(217,164,65,0.55)" stroke-width="0.8"/>
  <rect x="200" y="36" width="48" height="12" rx="2" fill="#FAFAFA"/>
  <text x="224" y="45" fill="#B8860B" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">GITHUB</text>
  <rect x="80" y="144" width="512" height="208" rx="8" fill="rgba(76,110,245,0.06)" stroke="rgba(76,110,245,0.35)" stroke-width="0.8"/>
  <rect x="88" y="148" width="48" height="12" rx="2" fill="#FAFAFA"/>
  <text x="112" y="157" fill="#4C6EF5" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">ENGINE</text>
  <rect x="608" y="144" width="208" height="96" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.40)" stroke-width="0.8"/>
  <rect x="616" y="148" width="104" height="12" rx="2" fill="#FAFAFA"/>
  <text x="668" y="157" fill="#7C3AED" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">REVIEWER ADAPTER</text>
  <rect x="240" y="368" width="336" height="96" rx="8" fill="rgba(18,184,134,0.07)" stroke="rgba(18,184,134,0.50)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <rect x="248" y="372" width="112" height="12" rx="2" fill="#FAFAFA"/>
  <text x="304" y="381" fill="#0E9F75" font-size="7" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">HEADLESS SESSIONS</text>

  <!-- edges -->
  <line x1="280" y1="112" x2="280" y2="176" stroke="#4f5d75" stroke-width="1" marker-start="url(#ar-arrow-start)" marker-end="url(#ar-arrow)"/>
  <line x1="280" y1="224" x2="280" y2="288" stroke="#4f5d75" stroke-width="1" marker-start="url(#ar-arrow-start)" marker-end="url(#ar-arrow)"/>
  <path d="M680,400 V368 Q680,360 672,360 H376 Q368,360 368,352 V336" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="224" y1="312" x2="256" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="384" y1="312" x2="432" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="344" y1="336" x2="344" y2="400" stroke="#4C6EF5" stroke-width="1.2" marker-end="url(#ar-arrow-accent)"/>
  <path d="M248,432 H56 Q48,432 48,424 V200 Q48,192 56,192 H224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <path d="M248,416 H72 Q64,416 64,408 V216 Q64,208 72,208 H220" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar-x)"/>
  <path d="M352,288 V224 Q352,216 360,216 H432" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="560" y1="192" x2="624" y2="192" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="624" y1="208" x2="560" y2="208" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>
  <line x1="432" y1="184" x2="336" y2="184" stroke="#4f5d75" stroke-width="1" marker-end="url(#ar-arrow)"/>

  <!-- edge labels -->
  <rect x="592" y="368" width="64" height="12" rx="2" fill="#FAFAFA"/>
  <text x="624" y="377" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">EVERY TICK</text>
  <rect x="104" y="172" width="40" height="12" rx="2" fill="#FAFAFA"/>
  <text x="124" y="181" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">PUSH</text>
  <rect x="72" y="244" width="152" height="24" rx="2" fill="#FAFAFA"/>
  <text x="148" y="253" fill="#2d3142" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">GUARD DENIES APPROVE / MERGE</text>
  <text x="148" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">(BUILT-IN TOOLS)</text>
  <rect x="572" y="216" width="40" height="12" rx="2" fill="#FAFAFA"/>
  <text x="592" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">VERDICT</text>
  <rect x="364" y="164" width="40" height="12" rx="2" fill="#FAFAFA"/>
  <text x="384" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.04em">MERGE</text>

  <!-- nodes -->
  <rect x="208" y="64" width="144" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="208" y="64" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="280" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Board/issues/PRs/CI</text>
  <rect x="224" y="176" width="112" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Forge adapter</text>
  <rect x="432" y="176" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="496" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Merge gate</text>
  <rect x="96" y="288" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="160" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Round orchestrator</text>
  <rect x="256" y="288" width="128" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="256" y="288" width="128" height="48" rx="6" fill="rgba(76,110,245,0.08)" stroke="#4C6EF5" stroke-width="1.2"/>
  <text x="320" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Conductor</text>
  <rect x="432" y="288" width="144" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="432" y="288" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="504" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">SQLite</text>
  <text x="504" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle">dispatched / observed / spent</text>
  <rect x="624" y="176" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="712" y="198" fill="#2d3142" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle">engine-agent session / hosted bot</text>
  <text x="712" y="210" fill="#2d3142" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle">same-model-trusted / human</text>
  <rect x="248" y="400" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="320" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Workers</text>
  <text x="320" y="436" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">+ fail-closed guard</text>
  <rect x="608" y="400" width="144" height="48" rx="6" fill="#FAFAFA"/>
  <rect x="608" y="400" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="680" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle">Human controls</text>
  <text x="680" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono',Menlo,Consolas,monospace" text-anchor="middle">pause / kill switch / e-stop</text>
</svg>
